name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Pinned: validate and test are the engine's own checks, so a new CLI may judge the same
      # code differently. Raise it on purpose, with the checks run locally first.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.288

      - name: Validate and test
        run: bash scripts/check.sh
